# Fly.io config. App names are global on Fly: if this one is taken, change it
# here or pass --app. Secrets (NUTRIENT_LICENSE_KEY, ALLOWED_ORIGINS, provider
# API keys, EXTRACTION_SERVICE_TOKEN) are set with `fly secrets set`.
app = "nutrient-python-sdk-api"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: a stopped machine costs rootfs storage only. "stop", not
  # "suspend": Fly discourages suspend above 2 GB, and boot is ~1 s anyway
  # because the SDK loads its ML models on the first request that needs them.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# 8 GB, measured on Fly: each ML feature keeps its model resident, and the VM's
# memory also holds the kernel. At 4 GB the kernel OOM-killed uvicorn (anon-rss
# 3.86 GB) on forms/detect after ICR, tables and OCR. At 8 GB that sequence ran
# twice with no OOM, ~5.1 GB in use with every model loaded. (A local
# `docker --memory` cap understated this: it leaves the kernel outside.)
# A dedicated core, not shared: on Fly, shared-cpu-1x ran out of burst credit
# and throttled document processing from seconds to minutes (measured on the
# .NET backend). With scale to zero it is billed per second only while running.
[[vm]]
  size = "performance-1x"
  memory = "8gb"
